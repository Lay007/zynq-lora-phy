[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zynq-lora-phy"
version = "0.1.0"
description = "Reference models for a Zynq LoRa PHY and TDoA positioning platform"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/Lay007/zynq-lora-phy"
Documentation = "https://github.com/Lay007/zynq-lora-phy/blob/main/docs/README.md"
Issues = "https://github.com/Lay007/zynq-lora-phy/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
hardware = [
    "paramiko>=3.4",
    "pyserial>=3.5",
    "pyadi-iio",
    "pylibiio",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
