; Heltec WiFi LoRa 32 V4 (SX1262) as a LoRa *receiver* for packet-error-rate
; curves. It shares the board description and board_config.hpp (power rails,
; FEM control, revision probe) with the transmitter firmware next to it.

[platformio]
default_envs = heltec-v4-sx1262-rx
boards_dir = ../heltec-v4-sx1262-tx/boards

[env:heltec-v4-sx1262-rx]
platform = espressif32@6.13.0
board = heltec_v4
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_16MB.csv
lib_deps =
    jgromes/RadioLib@7.7.1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -I../heltec-v4-sx1262-tx/include
