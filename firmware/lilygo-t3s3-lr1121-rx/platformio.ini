; LILYGO T3-S3 V1.2 (LR1121) as a LoRa *receiver* for packet-error-rate curves.
; Shares the board description and board_config.hpp with the transmitter
; firmware next to it.

[platformio]
default_envs = lilygo-t3s3-lr1121-rx
boards_dir = ../lilygo-t3s3-lr1121-tx/boards

[env:lilygo-t3s3-lr1121-rx]
platform = espressif32@6.13.0
board = t3_s3_v1_x
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps =
    jgromes/RadioLib@7.7.1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -I../lilygo-t3s3-lr1121-tx/include
