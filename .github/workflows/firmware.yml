name: Firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/lilygo-t3s3-lr1121-tx/**"
      - "firmware/heltec-v4-sx1262-tx/**"
      - "firmware/lilygo-t3s3-lr1121-rx/**"
      - "firmware/heltec-v4-sx1262-rx/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/lilygo-t3s3-lr1121-tx/**"
      - "firmware/heltec-v4-sx1262-tx/**"
      - "firmware/lilygo-t3s3-lr1121-rx/**"
      - "firmware/heltec-v4-sx1262-rx/**"
      - ".github/workflows/firmware.yml"

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platformio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.1.19
      - name: Build LILYGO LR1121 transmitter
        working-directory: firmware/lilygo-t3s3-lr1121-tx
        run: pio run
      - name: Build Heltec V4 SX1262 transmitter
        working-directory: firmware/heltec-v4-sx1262-tx
        run: pio run
      - name: Build LILYGO LR1121 receiver
        working-directory: firmware/lilygo-t3s3-lr1121-rx
        run: pio run
      - name: Build Heltec V4 SX1262 receiver
        working-directory: firmware/heltec-v4-sx1262-rx
        run: pio run
