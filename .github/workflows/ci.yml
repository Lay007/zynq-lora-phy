            fpga/tb/tb_lora_timestamp_metadata_join.sv
          vvp /tmp/timestamp_metadata_join_tb
      - name: Compile and run AXI-Lite status register testbench
        run: |
          iverilog -g2012 \
            -o /tmp/lora_axi_lite_status_tb \
            fpga/wrappers/lora_axi_lite_status.v \
            fpga/tb/tb_lora_axi_lite_status.sv
          vvp /tmp/lora_axi_lite_status_tb
      - name: Compile and run receiver control wrapper integration testbench
        run: |
          iverilog -g2012 \
            -o /tmp/lora_receiver_control_wrapper_tb \
            fpga/wrappers/lora_sample_counter_capture.v \
            fpga/wrappers/lora_timestamp_metadata_join.v \
