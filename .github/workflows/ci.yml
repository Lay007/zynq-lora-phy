          vvp /tmp/lora_packet_toa_receiver_top_tb
      - name: Compile and run symbol grid resync testbench
        run: |
          iverilog -g2012 -Wall -s tb_lora_symbol_grid_resync \
            -o /tmp/lora_symbol_grid_resync_tb \
            fpga/wrappers/lora_symbol_grid_resync.v \
            fpga/tb/tb_lora_symbol_grid_resync.sv
          vvp /tmp/lora_symbol_grid_resync_tb
      - name: Compile and run CFO derotator testbench
        run: |
          iverilog -g2012 -Wall -s tb_lora_cfo_derotator \
            -o /tmp/lora_cfo_derotator_tb \
            fpga/wrappers/lora_cfo_derotator.v \
            fpga/tb/tb_lora_cfo_derotator.sv
          vvp /tmp/lora_cfo_derotator_tb
      - name: Compile and run joint chirp grid controller testbench
        run: |
          iverilog -g2012 -Wall -s tb_lora_joint_chirp_grid_controller \
            -o /tmp/lora_joint_chirp_grid_controller_tb \
            fpga/wrappers/lora_joint_chirp_grid_controller.v \
            fpga/tb/tb_lora_joint_chirp_grid_controller.sv
          vvp /tmp/lora_joint_chirp_grid_controller_tb
      - name: Compile and run joint chirp grid path timing testbench
