name: CI

on:
  push:
    branches: [main, lora_cpp]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Auxiliary Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  rtl-wrapper-smoke:
    name: RTL integration wrapper smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile and run PL sample counter testbench
        run: |
          iverilog -g2012 \
            -o /tmp/lora_sample_counter_capture_tb \
            fpga/wrappers/lora_sample_counter_capture.v \
            fpga/tb/tb_lora_sample_counter_capture.sv
          vvp /tmp/lora_sample_counter_capture_tb
      - name: Compile and run IQ history buffer testbench
        run: |
          iverilog -g2012 -Wall \
            -o /tmp/lora_iq_history_buffer_tb \
            fpga/wrappers/lora_iq_history_buffer.v \
            fpga/tb/tb_lora_iq_history_buffer.sv
          vvp /tmp/lora_iq_history_buffer_tb
      - name: Compile and run iterative matched-filter MAC testbench
        run: |
          iverilog -g2012 -Wall \
            -o /tmp/lora_matched_filter_mac_tb \
            fpga/wrappers/lora_iq_history_buffer.v \
            fpga/wrappers/lora_matched_filter_mac.v \
            fpga/tb/tb_lora_matched_filter_mac.sv
          vvp /tmp/lora_matched_filter_mac_tb
      - name: Compile and run matched-filter search sequencer testbench
        run: |
          iverilog -g2012 -Wall \
            -o /tmp/lora_matched_filter_search_tb \
            fpga/wrappers/lora_iq_history_buffer.v \
            fpga/wrappers/lora_matched_filter_mac.v \
            fpga/wrappers/lora_peak_triplet_capture.v \
            fpga/wrappers/lora_matched_filter_search.v \
            fpga/tb/tb_lora_matched_filter_search.sv
          vvp /tmp/lora_matched_filter_search_tb
      - name: Compile and run full-size SF7/L8 matched-filter golden regression
        run: |
          iverilog -g2012 -Wall -s tb_lora_matched_filter_search_sf7_l8 \
            -o /tmp/lora_matched_filter_search_sf7_l8_tb \
            fpga/wrappers/lora_iq_history_buffer.v \
            fpga/wrappers/lora_reference_chirp_rom.v \
            fpga/wrappers/lora_matched_filter_mac.v \
            fpga/wrappers/lora_peak_triplet_capture.v \
            fpga/wrappers/lora_matched_filter_search.v \
            fpga/tb/tb_lora_matched_filter_search_sf7_l8.sv
