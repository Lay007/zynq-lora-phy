            fpga/wrappers/lora_receiver_control_wrapper.v \
            fpga/tb/tb_lora_receiver_control_wrapper.sv
          vvp /tmp/lora_receiver_control_wrapper_tb

  joint-grid-completion:
    # One leg per arrival phase. Each leg drives the full packet-rate receiver
    # past its down-search window, roughly 100 s on a hosted runner (derived
    # from the step timings of run 34460149677). Five in series pushed the RTL
    # smoke job past its ten-minute budget and cancelled it, so they run in
    # parallel here. Phases at and above half a symbol are the ones that
    # regressed the ToA symbol origin, so none of them may be dropped.
    name: Joint grid completion (grid_phase ${{ matrix.grid_phase }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        grid_phase: [0, 296, 512, 700, 1023]

    steps:
      - uses: actions/checkout@v7
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile joint grid completion testbench
        run: |
          iverilog -g2012 -DLORA_NAMESPACED_GENERATED -s tb_lora_joint_grid_completion \
            -o /tmp/lora_joint_grid_completion_tb \
            fpga/generated/fft-correlator-fixed/lora_fft_correlator_gen/*.v \
            fpga/generated/blind-detector/lora_blind_detector_gen/lora_blind_BlindDetector.v \
            fpga/generated/toa-interpolator/lora_toa_interpolator_gen/lora_toa_ToaInterpolator.v \
            fpga/wrappers/fft_correlator_route_top.v \
            fpga/wrappers/lora_detector_timestamp_align.v \
            fpga/wrappers/lora_detector_timestamp_path.v \
            fpga/wrappers/lora_cfo_derotator.v \
            fpga/wrappers/lora_fft_detector_timestamp_path.v \
            fpga/wrappers/lora_iq_history_buffer.v \
            fpga/wrappers/lora_reference_chirp_rom.v \
            fpga/wrappers/lora_matched_filter_mac.v \
            fpga/wrappers/lora_peak_triplet_capture.v \
            fpga/wrappers/lora_matched_filter_search.v \
            fpga/wrappers/lora_joint_chirp_grid_controller.v \
            fpga/wrappers/lora_symbol_grid_resync.v \
            fpga/wrappers/lora_timestamp_metadata_join.v \
            fpga/wrappers/lora_axi_lite_status.v \
            fpga/wrappers/lora_packet_toa_receiver_top.v \
            fpga/tb/tb_lora_joint_grid_completion.sv
      - name: Run joint grid completion at grid_phase ${{ matrix.grid_phase }}
        run: vvp /tmp/lora_joint_grid_completion_tb +grid_phase=${{ matrix.grid_phase }}
      # The packet timestamp must not move with the carrier offset: the
      # board's typical CFO displacement is about -3.4 samples, and an
      # upchirp-only timestamp is off by exactly that (fails here by +-3).
      - name: Run joint grid completion with carrier offset of both signs
        run: |
          vvp /tmp/lora_joint_grid_completion_tb +grid_phase=${{ matrix.grid_phase }} +cfo_nano=418000
          vvp /tmp/lora_joint_grid_completion_tb +grid_phase=${{ matrix.grid_phase }} +cfo_nano=-418000

  joint-grid-multi-packet:
    # M6: a capture campaign re-arms with trace_rearm_in between packets
    # instead of a full reset_in, because reset_in also zeros the absolute
    # sample counter the campaign needs to keep. Nothing else in this suite
    # drives two packets through the real receiver_top (real FFT detector)
    # with only one reset_in pulse at the start; this is that regression.
    name: Joint grid multi-packet continuity (no reset_in between packets)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile and run joint grid multi-packet testbench
        run: |
          iverilog -g2012 -DLORA_NAMESPACED_GENERATED -s tb_lora_joint_grid_multi_packet \
            -o /tmp/lora_joint_grid_multi_packet_tb \
            fpga/generated/fft-correlator-fixed/lora_fft_correlator_gen/*.v \
            fpga/generated/blind-detector/lora_blind_detector_gen/lora_blind_BlindDetector.v \
            fpga/generated/toa-interpolator/lora_toa_interpolator_gen/lora_toa_ToaInterpolator.v \
            fpga/wrappers/fft_correlator_route_top.v \
            fpga/wrappers/lora_detector_timestamp_align.v \
            fpga/wrappers/lora_detector_timestamp_path.v \
            fpga/wrappers/lora_cfo_derotator.v \
            fpga/wrappers/lora_fft_detector_timestamp_path.v \
            fpga/wrappers/lora_iq_history_buffer.v \
            fpga/wrappers/lora_reference_chirp_rom.v \
            fpga/wrappers/lora_matched_filter_mac.v \
            fpga/wrappers/lora_peak_triplet_capture.v \
            fpga/wrappers/lora_matched_filter_search.v \
            fpga/wrappers/lora_joint_chirp_grid_controller.v \
            fpga/wrappers/lora_symbol_grid_resync.v \
            fpga/wrappers/lora_timestamp_metadata_join.v \
            fpga/wrappers/lora_axi_lite_status.v \
            fpga/wrappers/lora_packet_toa_receiver_top.v \
            fpga/tb/tb_lora_joint_grid_multi_packet.sv
          vvp /tmp/lora_joint_grid_multi_packet_tb

  matlab:
    name: Authoritative MATLAB and Simulink tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # The tests build their own signals and write to tempname, so the Git LFS
      # reference captures are deliberately not fetched here.
      - uses: actions/checkout@v7
      - name: Set up MATLAB and Simulink
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025a
          products: Simulink
      - name: Run floating-point model regression suite
        uses: matlab-actions/run-command@v3
        with:
          command: cd('model/matlab'); results = run_tests; assertSuccess(results);
      - name: Run timestamp metadata regression
        uses: matlab-actions/run-command@v3
        with:
          command: cd('model/simulink'); report = run_timestamp_metadata_regression(WriteCsv=true, Verbose=true); assert(report.passed);
      - name: Upload timestamp metadata evidence
        uses: actions/upload-artifact@v7
        with:
          name: timestamp-metadata-regression
          path: docs/data/simulink-m2-timestamp-metadata.csv
          if-no-files-found: error
