            fpga/tb/tb_lora_fft_detector_timestamp_path.sv
          vvp /tmp/lora_fft_detector_timestamp_path_tb
      - name: Compile and run IQ to AXI packet timestamp testbench
        run: |
          iverilog -g2012 -Wall -DLORA_NAMESPACED_GENERATED -s tb_lora_packet_timestamp_axi_path \
            -o /tmp/lora_packet_timestamp_axi_path_tb \
